name: Refresh paper figures

on:
  push:
    paths:
      - ".github/workflows/refresh-figures.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pillow

      - name: Download arXiv source
        run: |
          set -euxo pipefail
          mkdir -p /tmp/muse-src
          curl -fL --retry 5 --retry-delay 3             -A "Mozilla/5.0 (MUSE project page figure refresh)"             https://arxiv.org/e-print/2609.33716             -o /tmp/muse-source.tar
          tar -xf /tmp/muse-source.tar -C /tmp/muse-src
          find /tmp/muse-src -maxdepth 4 -type f | sort | head -200

      - name: Locate original figure PDFs
        run: |
          set -euxo pipefail
          PIPELINE="$(find /tmp/muse-src -type f -iname 'pipeline.pdf' | head -1)"
          INVERSION="$(find /tmp/muse-src -type f -iname 'inversion.pdf' | head -1)"
          TSNE="$(find /tmp/muse-src -type f -iname 'tsne.pdf' | head -1)"
          test -n "$PIPELINE"
          test -n "$INVERSION"
          test -n "$TSNE"
          cp "$PIPELINE" /tmp/pipeline.pdf
          cp "$INVERSION" /tmp/inversion.pdf
          cp "$TSNE" /tmp/tsne.pdf
          ls -lh /tmp/pipeline.pdf /tmp/inversion.pdf /tmp/tsne.pdf

      - name: Render high-resolution figures
        run: |
          set -euxo pipefail
          pdftoppm -f 1 -singlefile -r 300 -png /tmp/pipeline.pdf /tmp/pipeline
          pdftoppm -f 1 -singlefile -r 300 -png /tmp/inversion.pdf /tmp/inversion
          pdftoppm -f 1 -singlefile -r 360 -png /tmp/tsne.pdf /tmp/tsne

          mkdir -p assets
          python - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path

          jobs = [
              ("/tmp/pipeline.png", "assets/pipeline.webp", 2600, 94),
              ("/tmp/inversion.png", "assets/bridge-generation.webp", 2600, 94),
              ("/tmp/tsne.png", "assets/tsne.webp", 3000, 96),
          ]

          def crop_white(im, pad=30):
              rgb = im.convert("RGB")
              bg = Image.new("RGB", rgb.size, "white")
              diff = ImageChops.difference(rgb, bg).convert("L")
              # Ignore tiny antialiasing/compression variations close to white.
              mask = diff.point(lambda p: 255 if p > 8 else 0)
              box = mask.getbbox()
              if not box:
                  return rgb
              l, t, r, b = box
              l = max(0, l - pad)
              t = max(0, t - pad)
              r = min(rgb.width, r + pad)
              b = min(rgb.height, b + pad)
              return rgb.crop((l, t, r, b))

          for src, dst, max_width, quality in jobs:
              im = Image.open(src)
              im = crop_white(im)
              if im.width > max_width:
                  height = round(im.height * max_width / im.width)
                  im = im.resize((max_width, height), Image.Resampling.LANCZOS)
              im.save(dst, "WEBP", quality=quality, method=6)
              print(dst, im.size, Path(dst).stat().st_size)
          PY

          file assets/pipeline.webp assets/bridge-generation.webp assets/tsne.webp
          ls -lh assets/pipeline.webp assets/bridge-generation.webp assets/tsne.webp

      - name: Commit refreshed figures
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pipeline.webp assets/bridge-generation.webp assets/tsne.webp
          if git diff --cached --quiet; then
            echo "No figure changes to commit."
            exit 0
          fi
          git commit -m "Replace project figures with high-resolution renders"
          git push
